// HUBTECH for Android – the whole HUBTECH server (Python) runs inside the app via Chaquopy,
// and a WebView shows it. Works without the computer; sync via Indstillinger → Data.
plugins {
    id 'com.android.application' version '8.5.2' apply false
    id 'com.chaquo.python' version '16.0.0' apply false
}

<!doctype html>
<html lang="da" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HUBTECH — dit digitale univers</title>
  <meta name="description" content="HUBTECH samler dine apps, Cursor-projekter, læringsforløb og læringsapps i ét levende, personligt arbejdsrum.">
  <meta name="theme-color" content="#141210">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icons/app-32.png" sizes="32x32" type="image/png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/app-180.png">
  <meta name="application-name" content="HUBTECH">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="HUBTECH">
  <link rel="preload" href="fonts/manrope-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/office.css">
  <link rel="stylesheet" href="css/community.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Spring til indhold</a>
  <canvas id="world" aria-hidden="true"></canvas>
  <div id="world-scrim" aria-hidden="true"></div>
  <div id="root"></div>
  <div class="boot" id="boot" role="status" aria-live="polite" aria-label="HUBTECH starter">
    <div class="boot-inner">
      <svg class="boot-mark" viewBox="0 0 64 64" aria-hidden="true">
        <rect class="bm-tile" width="64" height="64" rx="15"/>
        <rect class="bm-frame" x="8" y="12" width="48" height="40" rx="6" pathLength="100"/>
        <path class="bm-prompt" d="M15 24 L22 31 L15 38" pathLength="100"/>
        <path class="bm-h bm-h1" d="M30 22 V40" pathLength="100"/>
        <path class="bm-h bm-h2" d="M44 22 V40" pathLength="100"/>
        <path class="bm-h bm-h3" d="M30 31 H44" pathLength="100"/>
        <rect class="bm-cursor" x="30" y="44" width="14" height="3" rx="1.5"/>
      </svg>
      <div class="boot-word" aria-hidden="true"><span>HUBTECH</span></div>
      <div class="boot-bar" aria-hidden="true"><i></i></div>
      <div class="boot-label">Starter dit værksted</div>
    </div>
  </div>
  <noscript><p style="position:fixed;inset:0;display:grid;place-items:center;color:#fff;background:#050b14;font-family:sans-serif">HUBTECH kræver JavaScript.</p></noscript>
</body>
</html>
